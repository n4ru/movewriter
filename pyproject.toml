[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", "nativeapp/backend"]

[tool.ruff.lint]
# Conservative ruleset — catch real bugs, leave style alone for now.
#   E, W   pycodestyle errors / warnings
#   F      pyflakes (undefined names, unused imports)
#   B      flake8-bugbear (likely bugs)
#   UP     pyupgrade (modernize syntax)
select = ["E", "W", "F", "B", "UP"]
ignore = [
    "E501",  # line too long — handled by `line-length`; don't double-fail on URLs/comments
    "E731",  # lambda assignment — sometimes intentional
    "B008",  # function call in default arg — Tk widgets use this idiom
    "B904",  # raise X from Y — too noisy across existing exception handlers
    "UP015", # `open(...)` redundant mode args — leave existing code alone
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests sometimes import after fixture setup

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
